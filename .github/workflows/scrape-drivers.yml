name: Scrape Axioo Drivers

on:
  workflow_dispatch:
  schedule:
    - cron: "0 * * * *"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/scrape-drivers.yml"

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run scraper
        run: node scripts/scrape-axioo.mjs

      # Menggunakan Action Otomatis (Anti Error Rejected)
      - name: Commit and push generated files
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update Axioo Pongo 750 driver metadata"
          file_pattern: "generated/drivers.json generated/version.json"
          commit_user_name: "RusdiEneri"
          commit_user_email: "nuruddinrusydiilham@gmail.com"