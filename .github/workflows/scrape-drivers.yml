name: Scrape Axioo Drivers

on:
  workflow_dispatch:

  schedule:
    - cron: "0 * * * *"

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run scraper
        run: node scripts/scrape-axioo.mjs

      - name: Show changes
        run: git diff -- generated/

      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add generated/drivers.json generated/version.json

          if git diff --cached --quiet; then
            echo "No driver metadata changes."
            exit 0
          fi

          git commit -m "chore: update Axioo Pongo 750 driver metadata"
          git push