name: "Scrape Axioo Drivers"

on:
  workflow_dispatch:

  schedule:
    - cron: "0 * * * *"

  push:
    paths:
      - ".github/workflows/scrape-drivers.yml"

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: "Checkout"
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
          persist-credentials: true

      - name: "Sync main before scraper"
        shell: bash
        run: |
          set -Eeuo pipefail

          git fetch origin main
          git checkout main
          git reset --hard origin/main

          echo "✅ Repository sudah sinkron dengan origin/main."

      - name: "Setup Node.js"
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: "Run scraper"
        shell: bash
        run: |
          set -Eeuo pipefail

          node scripts/scrape-axioo.mjs

          echo
          echo "📂 Git status setelah scraper:"
          git status --short

      - name: "Commit and Push Verified"
        env:
          SIGNING_KEY: ${{ secrets.COMMIT_SIGNING_KEY }}
        shell: bash
        run: |
          set -Eeuo pipefail

          # ==========================================
          # 1. Validasi signing key
          # ==========================================
          if [[ -z "${SIGNING_KEY:-}" ]]; then
            echo "::error::Secret COMMIT_SIGNING_KEY tidak ditemukan atau kosong."
            exit 1
          fi

          # ==========================================
          # 2. Siapkan SSH signing key
          # ==========================================
          KEY_DIR="${RUNNER_TEMP}/git-signing"
          PRIVATE_KEY="${KEY_DIR}/signing_key"
          PUBLIC_KEY="${KEY_DIR}/signing_key.pub"
          ALLOWED_SIGNERS="${KEY_DIR}/allowed_signers"

          mkdir -p "$KEY_DIR"
          chmod 700 "$KEY_DIR"

          printf '%s\n' "$SIGNING_KEY" > "$PRIVATE_KEY"
          chmod 600 "$PRIVATE_KEY"

          ssh-keygen -y \
            -f "$PRIVATE_KEY" \
            > "$PUBLIC_KEY"

          chmod 644 "$PUBLIC_KEY"

          # ==========================================
          # 3. SSH agent
          # ==========================================
          eval "$(ssh-agent -s)"
          ssh-add "$PRIVATE_KEY"

          # ==========================================
          # 4. Git identity
          # ==========================================
          git config --local user.name "RusdiEneri"
          git config --local user.email "nuruddinrusydiilham@gmail.com"

          # ==========================================
          # 5. SSH commit signing
          # ==========================================
          git config --local gpg.format ssh
          git config --local gpg.ssh.program ssh-keygen

          PUBLIC_KEY_DATA="$(cat "$PUBLIC_KEY")"

          git config --local \
            user.signingkey \
            "key::${PUBLIC_KEY_DATA}"

          git config --local commit.gpgsign true

          # ==========================================
          # 6. Allowed signers
          # ==========================================
          printf '%s %s\n' \
            "nuruddinrusydiilham@gmail.com" \
            "$PUBLIC_KEY_DATA" \
            > "$ALLOWED_SIGNERS"

          chmod 644 "$ALLOWED_SIGNERS"

          git config --local \
            gpg.ssh.allowedSignersFile \
            "$ALLOWED_SIGNERS"

          echo "✅ SSH signing aktif."

          # ==========================================
          # 7. Stage hasil scraper
          # ==========================================
          git add \
            generated/drivers.json \
            generated/version.json

          echo
          echo "📋 Staged changes:"
          git status --short

          # ==========================================
          # 8. Tidak ada perubahan
          # ==========================================
          if git diff --cached --quiet; then
            echo
            echo "ℹ️ Scraper berjalan, tetapi data tidak berubah."
            echo "Tidak membuat commit."
            exit 0
          fi

          # ==========================================
          # 9. Signed commit
          # ==========================================
          COMMIT_TIME="$(TZ=Asia/Jakarta date '+%Y%m%d-%H%M')"

          git commit -S \
            -m "chore: update Axioo Pongo 750 driver metadata [${COMMIT_TIME}]"

          echo
          echo "✅ Signed commit berhasil dibuat."

          # ==========================================
          # 10. Verifikasi signature
          # ==========================================
          git verify-commit HEAD

          echo
          echo "✅ Signature valid."

          # ==========================================
          # 11. Push
          # ==========================================
          for attempt in 1 2 3 4 5; do
            echo
            echo "🚀 Push attempt ${attempt}/5..."

            if git push origin HEAD:main; then
              echo "✅ Push berhasil."
              exit 0
            fi

            if [[ "$attempt" -eq 5 ]]; then
              break
            fi

            echo "⚠️ Remote berubah, sinkronisasi ulang..."

            git fetch origin main
            git rebase --gpg-sign origin/main

            git verify-commit HEAD

            sleep 5
          done

          echo "::error::Gagal push setelah 5 percobaan."
          exit 1
