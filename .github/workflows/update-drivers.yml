name: Update Driver Metadata

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 1"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate version.json
        shell: python
        run: |
          import json
          from datetime import datetime, timezone

          with open("drivers.json", "r", encoding="utf-8") as f:
              data = json.load(f)

          versions = {}

          for driver in data["drivers"]:
              versions[driver["id"]] = driver["version"]

          if "special" in data:
              for key, driver in data["special"].items():
                  versions[key] = driver["version"]

          output = {
              "generated_at": datetime.now(timezone.utc).isoformat(),
              "model": f'{data["model"]["series"]} {data["model"]["model"]} {data["model"]["code"]}',
              "drivers": versions
          }

          with open("version.json", "w", encoding="utf-8") as f:
              json.dump(output, f, indent=2, ensure_ascii=False)
              f.write("\n")

      - name: Commit updated version.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add version.json

          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi

          git commit -m "chore: update driver versions"
          git push